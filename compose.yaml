name: sourceink

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sourceink}
      POSTGRES_USER: ${POSTGRES_USER:-sourceink}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-development-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://${POSTGRES_USER:-sourceink}:${POSTGRES_PASSWORD:-change-this-development-password}@postgres:5432/${POSTGRES_DB:-sourceink}?sslmode=disable
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE}
      AUTO_MIGRATE: "true"
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-admin@sourceink.local}
      DEV_ADMIN_USERNAME: ${DEV_ADMIN_USERNAME:-sourceink-admin}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:?set DEV_ADMIN_PASSWORD in .env}
      DEV_USER_EMAIL: ${DEV_USER_EMAIL:-user@sourceink.local}
      DEV_USER_USERNAME: ${DEV_USER_USERNAME:-sourceink-user}
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:-}
      GITHUB_PUBLISHER_APP_SLUG: ${GITHUB_PUBLISHER_APP_SLUG:-}
      GITHUB_PUBLISHER_CLIENT_ID: ${GITHUB_PUBLISHER_CLIENT_ID:-}
      GITHUB_PUBLISHER_CLIENT_SECRET: ${GITHUB_PUBLISHER_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_PUBLISHER_PRIVATE_KEY_PATH: /run/secrets/github_publisher_private_key
      GITHUB_API_BASE_URL: ${GITHUB_API_BASE_URL:-https://api.github.com}
    secrets:
      - source: github_publisher_private_key
        target: github_publisher_private_key
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      API_INTERNAL_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:

secrets:
  github_publisher_private_key:
    file: ${GITHUB_PUBLISHER_PRIVATE_KEY_PATH}
